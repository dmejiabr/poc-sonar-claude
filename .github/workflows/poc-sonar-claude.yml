name: Análisis de Calidad con Sonar

on:
  # En el plan Free de SonarQube Cloud los pushes se analizan únicamente sobre la rama principal.
  # Los Pull Requests hacia main se mantienen habilitados.
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisis-sonar:
    name: Análisis de Calidad con Sonar
    runs-on: ubuntu-latest

    env:
      # Configuración de SonarQube Cloud para la POC
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: dmejiabr

      # Token existente en GitHub Actions
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Obtener el código completo para que Sonar disponga del historial Git.
      - name: Obtener código del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # El nombre del repositorio será el identificador base de todo el flujo.
      # Ejemplo:
      #   Repositorio GitHub : poc-sonar-claude
      #   Project Key Sonar  : poc-sonar-claude
      #   Project Name Sonar : poc-sonar-claude
      - name: Resolver contexto del análisis
        shell: bash
        run: |
          set -euo pipefail

          NOMBRE_REPOSITORIO="${GITHUB_REPOSITORY##*/}"
          NOMBRE_RAMA="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          SONAR_PROJECT_KEY="${NOMBRE_REPOSITORIO}"
          SONAR_PROJECT_NAME="${NOMBRE_REPOSITORIO}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            SONAR_CONTEXT_TYPE="pullRequest"
            SONAR_CONTEXT_VALUE="${{ github.event.pull_request.number }}"
          else
            # En SonarQube Cloud Free la rama principal se consulta sin
            # enviar el parámetro branch. Esto evita que "main" sea
            # interpretada como una rama secundaria.
            SONAR_CONTEXT_TYPE="main"
            SONAR_CONTEXT_VALUE=""
          fi

          echo "SONAR_PROJECT_KEY=${SONAR_PROJECT_KEY}" >> "${GITHUB_ENV}"
          echo "SONAR_PROJECT_NAME=${SONAR_PROJECT_NAME}" >> "${GITHUB_ENV}"
          echo "SONAR_BRANCH=${NOMBRE_RAMA}" >> "${GITHUB_ENV}"
          echo "SONAR_CONTEXT_TYPE=${SONAR_CONTEXT_TYPE}" >> "${GITHUB_ENV}"
          echo "SONAR_CONTEXT_VALUE=${SONAR_CONTEXT_VALUE}" >> "${GITHUB_ENV}"

          echo "=========================================="
          echo " CONTEXTO DEL ANÁLISIS SONAR"
          echo "=========================================="
          echo "Repositorio       : ${GITHUB_REPOSITORY}"
          echo "Nombre proyecto   : ${SONAR_PROJECT_NAME}"
          echo "Clave proyecto    : ${SONAR_PROJECT_KEY}"
          echo "Organización      : ${SONAR_ORGANIZATION}"
          echo "Rama              : ${NOMBRE_RAMA}"
          echo "Commit            : ${GITHUB_SHA}"
          echo "Evento            : ${GITHUB_EVENT_NAME}"
          echo "Contexto REST     : ${SONAR_CONTEXT_TYPE}=${SONAR_CONTEXT_VALUE}"

      # Validar el token antes de iniciar cualquier operación.
      - name: Validar autenticación con Sonar
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS \
            --request GET \
            "${SONAR_HOST_URL}/api/authentication/validate" \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --header "Accept: application/json" \
            --output validacion-token-sonar.json

          if [ "$(jq -r '.valid // false' validacion-token-sonar.json)" != "true" ]; then
            echo "El token configurado en SONAR_TOKEN no es válido."
            exit 1
          fi

          echo "Autenticación con Sonar validada correctamente."

      # Validar la organización, siguiendo el mismo enfoque de la colección de referencia.
      - name: Validar organización de Sonar
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS \
            --get \
            "${SONAR_HOST_URL}/api/organizations/search" \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "organizations=${SONAR_ORGANIZATION}" \
            --output organizacion-sonar.json

          if ! jq -e \
            --arg ORGANIZACION "${SONAR_ORGANIZATION}" \
            '.organizations[]? | select(.key == $ORGANIZACION)' \
            organizacion-sonar.json >/dev/null; then
            echo "No se encontró la organización ${SONAR_ORGANIZATION} en Sonar."
            exit 1
          fi

          echo "Organización ${SONAR_ORGANIZATION} validada correctamente."

      # Si el proyecto todavía no existe, se crea automáticamente.
      # El Project Key y el nombre del proyecto serán iguales al nombre del repositorio.
      - name: Validar o crear proyecto en Sonar
        shell: bash
        run: |
          set -euo pipefail

          CODIGO_HTTP="$(
            curl -sS \
              --get \
              "${SONAR_HOST_URL}/api/components/show" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "component=${SONAR_PROJECT_KEY}" \
              --output proyecto-sonar.json \
              --write-out "%{http_code}"
          )"

          if [ "${CODIGO_HTTP}" = "200" ]; then
            echo "El proyecto ${SONAR_PROJECT_KEY} ya existe en Sonar."

          elif [ "${CODIGO_HTTP}" = "404" ]; then
            echo "El proyecto ${SONAR_PROJECT_KEY} no existe."
            echo "Creando proyecto en Sonar por primera vez..."

            CODIGO_CREACION="$(
              curl -sS \
                --request POST \
                "${SONAR_HOST_URL}/api/projects/create" \
                --header "Authorization: Bearer ${SONAR_TOKEN}" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --header "Accept: application/json" \
                --data-urlencode "organization=${SONAR_ORGANIZATION}" \
                --data-urlencode "project=${SONAR_PROJECT_KEY}" \
                --data-urlencode "name=${SONAR_PROJECT_NAME}" \
                --output creacion-proyecto-sonar.json \
                --write-out "%{http_code}"
            )"

            if [ "${CODIGO_CREACION}" -lt 200 ] || [ "${CODIGO_CREACION}" -ge 300 ]; then
              echo "No fue posible crear el proyecto en Sonar."
              echo "Código HTTP: ${CODIGO_CREACION}"
              cat creacion-proyecto-sonar.json || true
              echo
              echo "Verifica que SONAR_TOKEN tenga permisos para crear proyectos en la organización."
              exit 1
            fi

            echo "Proyecto ${SONAR_PROJECT_KEY} creado correctamente."

          else
            echo "No fue posible validar el proyecto en Sonar."
            echo "Código HTTP: ${CODIGO_HTTP}"
            cat proyecto-sonar.json || true
            exit 1
          fi

      # Verificar el nombre de la rama principal registrada en Sonar.
      # Los proyectos creados por API pueden quedar inicialmente con "master".
      # Para Banco Exterior se busca mantener "main" como rama principal.
      - name: Validar rama principal del proyecto en Sonar
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS \
            --get \
            "${SONAR_HOST_URL}/api/project_branches/list" \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "project=${SONAR_PROJECT_KEY}" \
            --output ramas-proyecto-sonar.json

          RAMA_PRINCIPAL_SONAR="$(
            jq -r '
              [.branches[]? | select(.isMain == true) | .name][0] // empty
            ' ramas-proyecto-sonar.json
          )"

          EXISTE_MAIN="$(
            jq -r '
              any(.branches[]?; .name == "main")
            ' ramas-proyecto-sonar.json
          )"

          echo "Rama principal registrada en Sonar: ${RAMA_PRINCIPAL_SONAR:-No disponible}"
          echo "Existe rama main en Sonar: ${EXISTE_MAIN}"

          if [ "${RAMA_PRINCIPAL_SONAR}" = "main" ]; then
            echo "La rama principal de Sonar ya es main."

          elif [ "${EXISTE_MAIN}" = "true" ]; then
            echo "La rama main ya existe, pero no es la principal."
            echo "Promoviendo main como rama principal..."

            CODIGO_CAMBIO="$(
              curl -sS \
                --request POST \
                "${SONAR_HOST_URL}/api/project_branches/set_main" \
                --header "Authorization: Bearer ${SONAR_TOKEN}" \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --header "Accept: application/json" \
                --data-urlencode "project=${SONAR_PROJECT_KEY}" \
                --data-urlencode "branch=main" \
                --output cambio-rama-principal-sonar.json \
                --write-out "%{http_code}"
            )"

            if [ "${CODIGO_CAMBIO}" -ge 200 ] && [ "${CODIGO_CAMBIO}" -lt 300 ]; then
              echo "La rama main fue establecida como rama principal de Sonar."
            else
              echo "No fue posible establecer main como rama principal."
              echo "Código HTTP: ${CODIGO_CAMBIO}"
              cat cambio-rama-principal-sonar.json || true
              exit 1
            fi

          else
            echo "La rama main todavía no existe en Sonar."
            echo "Primero debe existir un análisis de main antes de establecerla como principal."
            exit 1
          fi

          curl -fsS \
            --get \
            "${SONAR_HOST_URL}/api/project_branches/list" \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "project=${SONAR_PROJECT_KEY}" \
            --output ramas-proyecto-sonar-despues.json

          RAMA_PRINCIPAL_FINAL="$(
            jq -r '
              [.branches[]? | select(.isMain == true) | .name][0] // empty
            ' ramas-proyecto-sonar-despues.json
          )"

          echo "Rama principal final en Sonar: ${RAMA_PRINCIPAL_FINAL:-No disponible}"

          if [ "${RAMA_PRINCIPAL_FINAL}" != "main" ]; then
            echo "La rama principal de Sonar no quedó configurada como main."
            exit 1
          fi

      # Generar la configuración del scanner dinámicamente.
      # Esto evita tener que mantener un Project Key fijo dentro del repositorio.
      - name: Generar configuración del análisis
        shell: bash
        run: |
          set -euo pipefail

          cat > sonar-project.properties <<EOF2
          sonar.organization=${SONAR_ORGANIZATION}
          sonar.projectKey=${SONAR_PROJECT_KEY}
          sonar.projectName=${SONAR_PROJECT_NAME}
          sonar.sources=.
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=.git/**,.github/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/.venv/**,**/venv/**
          sonar.qualitygate.wait=false
          EOF2

          echo "Configuración generada:"
          cat sonar-project.properties

      # Ejecutar el análisis oficial de SonarQube Cloud.
      - name: Ejecutar análisis de Sonar
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # El scanner genera report-task.txt.
      # Utilizamos su ceTaskId para seguir exactamente el análisis recién enviado.
      - name: Obtener identificador de procesamiento
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVO_TAREA=".scannerwork/report-task.txt"

          if [ ! -f "${ARCHIVO_TAREA}" ]; then
            echo "No se encontró ${ARCHIVO_TAREA}."
            exit 1
          fi

          cp "${ARCHIVO_TAREA}" tarea-procesamiento-sonar.txt

          CE_TASK_ID="$(
            grep '^ceTaskId=' "${ARCHIVO_TAREA}" \
            | cut -d'=' -f2- \
            | tr -d '\r'
          )"

          if [ -z "${CE_TASK_ID}" ]; then
            echo "No fue posible obtener ceTaskId."
            exit 1
          fi

          echo "SONAR_CE_TASK_ID=${CE_TASK_ID}" >> "${GITHUB_ENV}"
          echo "ID de procesamiento Sonar: ${CE_TASK_ID}"

      # Esperar a que Sonar termine de procesar el análisis antes de consultar resultados.
      - name: Esperar procesamiento del análisis
        shell: bash
        run: |
          set -euo pipefail

          COMPLETADO=false

          for INTENTO in $(seq 1 60); do
            curl -fsS \
              --get \
              "${SONAR_HOST_URL}/api/ce/task" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "id=${SONAR_CE_TASK_ID}" \
              --output tarea-sonar.json

            ESTADO="$(
              jq -r '.task.status // empty' tarea-sonar.json
            )"

            echo "Intento ${INTENTO} - Estado del procesamiento: ${ESTADO}"

            if [ "${ESTADO}" = "SUCCESS" ]; then
              COMPLETADO=true
              break
            fi

            if [ "${ESTADO}" = "FAILED" ] || [ "${ESTADO}" = "CANCELED" ]; then
              echo "El procesamiento del análisis terminó con estado ${ESTADO}."
              cat tarea-sonar.json
              exit 1
            fi

            sleep 5
          done

          if [ "${COMPLETADO}" != "true" ]; then
            echo "Se agotó el tiempo esperando el procesamiento de Sonar."
            exit 1
          fi

          ANALYSIS_ID="$(
            jq -r '.task.analysisId // empty' tarea-sonar.json
          )"

          if [ -z "${ANALYSIS_ID}" ]; then
            echo "Sonar terminó el procesamiento, pero no devolvió analysisId."
            cat tarea-sonar.json
            exit 1
          fi

          echo "SONAR_ANALYSIS_ID=${ANALYSIS_ID}" >> "${GITHUB_ENV}"
          echo "ID del análisis Sonar: ${ANALYSIS_ID}"

      # Consultar el histórico de análisis, como en la colección de referencia.
      - name: Obtener información del análisis
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS \
            --get \
            "${SONAR_HOST_URL}/api/project_analyses/search" \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "organization=${SONAR_ORGANIZATION}" \
            --data-urlencode "project=${SONAR_PROJECT_KEY}" \
            --output analisis-proyecto-sonar.json

          echo "Análisis identificado: ${SONAR_ANALYSIS_ID}"

      # Recuperar todos los issues mediante paginación completa.
      # Se conserva el filtro por proyecto, contexto y analysisId utilizado en la colección.
      - name: Descargar todos los hallazgos de Sonar
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          host = os.environ["SONAR_HOST_URL"].rstrip("/")
          token = os.environ["SONAR_TOKEN"]
          organization = os.environ["SONAR_ORGANIZATION"]
          project_key = os.environ["SONAR_PROJECT_KEY"]
          analysis_id = os.environ["SONAR_ANALYSIS_ID"]
          context_type = os.environ["SONAR_CONTEXT_TYPE"]
          context_value = os.environ["SONAR_CONTEXT_VALUE"]

          page_size = 500
          page = 1
          issues = []
          total = None

          while total is None or len(issues) < total:
              params = {
                  "organization": organization,
                  "projectKeys": project_key,
                  "analyses": analysis_id,
                  "ps": page_size,
                  "p": page,
              }

              if context_type == "pullRequest" and context_value:
                  params["pullRequest"] = context_value

              url = (
                  f"{host}/api/issues/search?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      document = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Sonar respondió HTTP {error.code} al consultar hallazgos. "
                      f"Respuesta: {body}"
                  ) from error

              page_issues = document.get("issues") or []
              paging = document.get("paging") or {}

              if total is None:
                  try:
                      total = int(
                          paging.get(
                              "total",
                              document.get("total", len(page_issues)),
                          )
                      )
                  except Exception:
                      total = len(page_issues)

                  print(f"Total de hallazgos esperado: {total}")

              issues.extend(page_issues)

              print(
                  f"Página {page}: "
                  f"recibidos={len(page_issues)}, "
                  f"acumulados={len(issues)}"
              )

              if not page_issues or len(issues) >= total:
                  break

              page += 1

          if total is None:
              total = len(issues)

          if len(issues) != total:
              raise RuntimeError(
                  "La cantidad de hallazgos descargados "
                  f"({len(issues)}) no coincide con el total ({total})."
              )

          output = {
              "analysisId": analysis_id,
              "projectKey": project_key,
              "total": total,
              "issues": issues,
          }

          with open("hallazgos-sonar.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Descarga completa: {len(issues)} hallazgos.")
          PY

      # Recuperar las mismas métricas principales utilizadas en la colección de referencia.
      - name: Descargar métricas y Quality Gate
        shell: bash
        run: |
          set -euo pipefail

          METRICAS="new_violations,new_accepted_issues,new_coverage,new_lines_to_cover,new_uncovered_lines,new_duplicated_lines_density,new_duplicated_lines,new_lines,new_security_hotspots,alert_status,quality_gate_details"

          if [ "${SONAR_CONTEXT_TYPE}" = "pullRequest" ]; then
            curl -fsS \
              --get \
              "${SONAR_HOST_URL}/api/measures/component" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "organization=${SONAR_ORGANIZATION}" \
              --data-urlencode "component=${SONAR_PROJECT_KEY}" \
              --data-urlencode "pullRequest=${SONAR_CONTEXT_VALUE}" \
              --data-urlencode "metricKeys=${METRICAS}" \
              --output metricas-sonar.json
          else
            curl -fsS \
              --get \
              "${SONAR_HOST_URL}/api/measures/component" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "organization=${SONAR_ORGANIZATION}" \
              --data-urlencode "component=${SONAR_PROJECT_KEY}" \
              --data-urlencode "metricKeys=${METRICAS}" \
              --output metricas-sonar.json
          fi

          QUALITY_GATE="$(
            jq -r '
              [
                .component.measures[]?
                | select(.metric == "alert_status")
                | .value
              ][0] // "DESCONOCIDO"
            ' metricas-sonar.json
          )"

          echo "SONAR_QUALITY_GATE=${QUALITY_GATE}" >> "${GITHUB_ENV}"

          echo "=========================================="
          echo " RESULTADOS DEL ANÁLISIS SONAR"
          echo "=========================================="
          echo "Proyecto       : ${SONAR_PROJECT_KEY}"
          echo "Rama           : ${SONAR_BRANCH}"
          echo "ID del análisis: ${SONAR_ANALYSIS_ID}"
          echo "Quality Gate   : ${QUALITY_GATE}"
          echo "Hallazgos      : $(jq -r '.total // 0' hallazgos-sonar.json)"
          echo
          echo "Métricas:"
          jq -r '
            .component.measures[]?
            | "\(.metric): \(.value // "N/D")"
          ' metricas-sonar.json

      # Normalizar los resultados de Sonar al contrato de datos de Banco Exterior.
      - name: Normalizar resultados para Port
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          def cargar(ruta):
              with open(ruta, "r", encoding="utf-8") as archivo:
                  return json.load(archivo)

          hallazgos_doc = cargar("hallazgos-sonar.json")
          metricas_doc = cargar("metricas-sonar.json")
          analisis_doc = cargar("analisis-proyecto-sonar.json")

          analysis_id = os.environ["SONAR_ANALYSIS_ID"]
          project_key = os.environ["SONAR_PROJECT_KEY"]
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          branch = os.environ["SONAR_BRANCH"]

          def valor_metrica(nombre, defecto=0):
              medidas = metricas_doc.get("component", {}).get("measures", [])
              medida = next((m for m in medidas if m.get("metric") == nombre), None)
              if not medida:
                  return defecto

              valor = medida.get("value")
              if valor is None and isinstance(medida.get("period"), dict):
                  valor = medida["period"].get("value")
              if valor is None and medida.get("periods"):
                  valor = medida["periods"][0].get("value")

              if valor in (None, ""):
                  return defecto
              return valor

          def numero(nombre, entero=False):
              valor = valor_metrica(nombre, 0)
              try:
                  numero = float(valor)
                  return int(numero) if entero else numero
              except (TypeError, ValueError):
                  return 0

          fecha_analisis = None
          for elemento in analisis_doc.get("analyses", []):
              if elemento.get("key") == analysis_id:
                  fecha_analisis = elemento.get("date")
                  break

          if not fecha_analisis:
              fecha_analisis = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def calidad(issue):
              impactos = issue.get("impacts") or []
              calidades = [i.get("softwareQuality") for i in impactos if i.get("softwareQuality")]
              valor = calidades[0] if calidades else None

              if valor == "SECURITY":
                  return "Seguridad"
              if valor == "RELIABILITY":
                  return "Fiabilidad"
              if valor == "MAINTAINABILITY":
                  return "Mantenibilidad"

              tipo = issue.get("type")
              if tipo == "VULNERABILITY":
                  return "Seguridad"
              if tipo == "BUG":
                  return "Fiabilidad"
              if tipo == "CODE_SMELL":
                  return "Mantenibilidad"
              return "No disponible"

          def severidad(issue):
              impactos = issue.get("impacts") or []
              prioridades = {
                  "BLOCKER": 5,
                  "CRITICAL": 4,
                  "HIGH": 4,
                  "MAJOR": 3,
                  "MEDIUM": 3,
                  "MINOR": 2,
                  "LOW": 2,
                  "INFO": 1,
              }

              candidatos = []
              if issue.get("severity"):
                  candidatos.append(issue["severity"])

              for impacto in impactos:
                  if impacto.get("severity"):
                      candidatos.append(impacto["severity"])

              if not candidatos:
                  return "Informativa"

              valor = max(candidatos, key=lambda x: prioridades.get(x, 0))

              if valor == "BLOCKER":
                  return "Bloqueante"
              if valor in ("CRITICAL", "HIGH"):
                  return "Alta"
              if valor in ("MAJOR", "MEDIUM"):
                  return "Media"
              if valor in ("MINOR", "LOW"):
                  return "Baja"
              return "Informativa"

          def estado(valor):
              return {
                  "OPEN": "Abierto",
                  "REOPENED": "Abierto",
                  "CONFIRMED": "Confirmado",
                  "ACCEPTED": "Aceptado",
                  "FALSE_POSITIVE": "Falso positivo",
                  "FALSE-POSITIVE": "Falso positivo",
                  "FIXED": "Corregido",
                  "CLOSED": "Corregido",
                  "RESOLVED": "Corregido",
              }.get(valor, "Desconocido")

          def tipo_hallazgo(valor):
              return {
                  "VULNERABILITY": "Vulnerabilidad",
                  "BUG": "Error",
                  "CODE_SMELL": "Problema de mantenibilidad",
              }.get(valor, "No disponible")

          normalizados = []
          for issue in hallazgos_doc.get("issues", []):
              componente = issue.get("component") or ""
              archivo = componente.split(":", 1)[1] if ":" in componente else componente

              normalizados.append({
                  "id-hallazgo": issue.get("key") or "hallazgo-sin-id",
                  "descripcion": issue.get("message") or "Sin descripción disponible",
                  "calidad-software": calidad(issue),
                  "severidad": severidad(issue),
                  "estado": estado(issue.get("status")),
                  "tipo-hallazgo": tipo_hallazgo(issue.get("type")),
                  "regla": issue.get("rule") or "No disponible",
                  "archivo": archivo or "No disponible",
                  "numero-linea": issue.get("line") or 0,
                  "esfuerzo-remediacion": issue.get("effort") or issue.get("debt") or "",
                  "fecha-creacion": issue.get("creationDate") or "2999-01-01T00:00:00Z",
                  "fecha-actualizacion": issue.get("updateDate") or issue.get("creationDate") or "2999-01-01T00:00:00Z",
                  "etiquetas": issue.get("tags") or [],
                  "componente": componente or "No disponible",
                  "clave-proyecto-sonar": project_key,
              })

          por_calidad = Counter(h["calidad-software"] for h in normalizados)
          por_severidad = Counter(h["severidad"] for h in normalizados)

          quality_gate_raw = str(valor_metrica("alert_status", "DESCONOCIDO"))
          quality_gate = {
              "OK": "Aprobado",
              "ERROR": "No aprobado",
          }.get(quality_gate_raw, "Desconocido")

          analisis_port = {
              "tipo-evento": "analisis-sonar",
              "analisis": {
                  "id-analisis": analysis_id,
                  "clave-proyecto-sonar": project_key,
                  "repositorio": repo,
                  "rama": branch,
                  "fecha-analisis": fecha_analisis,
                  "estado-quality-gate": quality_gate,
                  "metricas": {
                      "cobertura": numero("new_coverage"),
                      "lineas-nuevas": numero("new_lines", entero=True),
                      "lineas-por-cubrir": numero("new_lines_to_cover", entero=True),
                      "lineas-no-cubiertas": numero("new_uncovered_lines", entero=True),
                      "densidad-lineas-duplicadas": numero("new_duplicated_lines_density"),
                      "lineas-duplicadas": numero("new_duplicated_lines", entero=True),
                      "hallazgos-nuevos": numero("new_violations", entero=True),
                      "hallazgos-aceptados": numero("new_accepted_issues", entero=True),
                      "security-hotspots": numero("new_security_hotspots", entero=True),
                  },
                  "resumen": {
                      "hallazgos-seguridad": por_calidad["Seguridad"],
                      "hallazgos-fiabilidad": por_calidad["Fiabilidad"],
                      "hallazgos-mantenibilidad": por_calidad["Mantenibilidad"],
                      "hallazgos-bloqueantes": por_severidad["Bloqueante"],
                      "hallazgos-altos": por_severidad["Alta"],
                      "hallazgos-medios": por_severidad["Media"],
                      "hallazgos-bajos": por_severidad["Baja"],
                      "hallazgos-informativos": por_severidad["Informativa"],
                      "total-hallazgos": len(normalizados),
                  },
              },
          }

          with open("analisis-sonar-port.json", "w", encoding="utf-8") as archivo:
              json.dump(analisis_port, archivo, ensure_ascii=False, indent=2)

          carpeta = Path("hallazgos-sonar-port")
          carpeta.mkdir(exist_ok=True)

          tamano_lote = 100
          for indice in range(0, len(normalizados), tamano_lote):
              lote = normalizados[indice:indice + tamano_lote]
              numero_lote = (indice // tamano_lote) + 1
              payload = {
                  "tipo-evento": "hallazgos-sonar",
                  "id-analisis": analysis_id,
                  "clave-proyecto-sonar": project_key,
                  "hallazgos": lote,
              }
              ruta = carpeta / f"hallazgos-sonar-port-{numero_lote:04d}.json"
              ruta.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          print(f"Análisis normalizado: {analysis_id}")
          print(f"Hallazgos normalizados: {len(normalizados)}")
          print(f"Lotes preparados: {(len(normalizados) + tamano_lote - 1) // tamano_lote}")
          PY

      # Publicar primero el análisis padre y después todos los lotes de hallazgos.
      - name: Publicar resultados en Port
        shell: bash
        env:
          PORT_BE_SONAR_WEBHOOK_URL: ${{ secrets.PORT_BE_SONAR_WEBHOOK_URL }}
          PORT_BE_SONAR_WEBHOOK_SECRET: ${{ secrets.PORT_BE_SONAR_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import hmac
          import os
          import urllib.error
          import urllib.request
          import uuid
          from pathlib import Path

          url = os.environ["PORT_BE_SONAR_WEBHOOK_URL"]
          secret = os.environ["PORT_BE_SONAR_WEBHOOK_SECRET"].encode("utf-8")

          if not url or not secret:
              raise RuntimeError("Faltan los secretos de integración con Port.")

          def enviar(ruta):
              contenido = Path(ruta).read_bytes()
              firma = hmac.new(secret, contenido, hashlib.sha256).hexdigest()
              id_evento = str(uuid.uuid4())

              solicitud = urllib.request.Request(
                  url,
                  data=contenido,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "x-be-id-evento": id_evento,
                      "x-be-firma": f"sha256={firma}",
                  },
              )

              try:
                  with urllib.request.urlopen(solicitud, timeout=120) as respuesta:
                      codigo = respuesta.getcode()
                      cuerpo = respuesta.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as error:
                  cuerpo = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Port respondió HTTP {error.code} para {ruta}. Respuesta: {cuerpo}"
                  ) from error

              if codigo < 200 or codigo >= 300:
                  raise RuntimeError(
                      f"Port respondió HTTP {codigo} para {ruta}. Respuesta: {cuerpo}"
                  )

              print(f"Enviado correctamente a Port: {ruta}")

          enviar("analisis-sonar-port.json")

          lotes = sorted(Path("hallazgos-sonar-port").glob("*.json"))
          for lote in lotes:
              enviar(str(lote))

          print(f"Lotes de hallazgos enviados: {len(lotes)}")
          PY

      # Guardar evidencia para la POC y para futuras validaciones con Port.
      - name: Guardar evidencias del análisis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-sonar-${{ github.run_number }}
          path: |
            sonar-project.properties
            validacion-token-sonar.json
            organizacion-sonar.json
            proyecto-sonar.json
            creacion-proyecto-sonar.json
            ramas-proyecto-sonar.json
            cambio-rama-principal-sonar.json
            ramas-proyecto-sonar-despues.json
            tarea-procesamiento-sonar.txt
            tarea-sonar.json
            analisis-proyecto-sonar.json
            hallazgos-sonar.json
            metricas-sonar.json
            analisis-sonar-port.json
            hallazgos-sonar-port/
          retention-days: 7
          if-no-files-found: ignore

      # Igual que en la POC de Checkmarx, el control se aplica al final.
      # Esto permitirá posteriormente publicar primero los resultados en Port
      # y después bloquear el pipeline si el Quality Gate falla.
      - name: Aplicar resultado del Quality Gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          QUALITY_GATE="${SONAR_QUALITY_GATE:-DESCONOCIDO}"

          if [ "${QUALITY_GATE}" = "OK" ]; then
            echo "El Quality Gate de Sonar fue aprobado."
            exit 0
          fi

          if [ "${QUALITY_GATE}" = "ERROR" ]; then
            echo "El Quality Gate de Sonar no fue aprobado."
            echo "El análisis y sus evidencias fueron procesados antes de aplicar el fallo."
            exit 1
          fi

          echo "No fue posible determinar el estado del Quality Gate."
          echo "Estado recibido: ${QUALITY_GATE}"
          echo "No se genera un segundo fallo porque una etapa anterior pudo haber terminado con error."
          exit 0
